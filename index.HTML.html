<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kado Buat Kamu</title>

<style>
/* Layout: satu kolom sempit. Kotak kado di tengah layar jadi pintu masuk; setelah dibuka, isinya mengalir ke bawah rata kiri. */
:root{
  --bg:#fbeef0;
  --surface:#fff8f8;
  --ink:#3b1421;
  --muted:#85505f;
  --accent:#d12e4a;
  --accent-ink:#fff6f7;
  --line:#efcad2;
  --box:#f3aebb;
  --box-dark:#e48ea1;
  --ribbon:#d12e4a;
  --flame:#f5a524;
  --paper:#fffdfb;
  --paper-ink:#3b1421;
  --display:"Young Serif",Georgia,serif;
  --body:"Figtree",system-ui,sans-serif;
  --hand:"Caveat","Segoe Script",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c0d14;--surface:#2a131d;--ink:#fbe6ea;--muted:#d4a3b1;--accent:#ff7f97;--accent-ink:#2a0d16;
    --line:#4a2431;--box:#8d3a52;--box-dark:#a8465f;--ribbon:#ff7f97;--flame:#ffc46b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c0d14;--surface:#2a131d;--ink:#fbe6ea;--muted:#d4a3b1;--accent:#ff7f97;--accent-ink:#2a0d16;
  --line:#4a2431;--box:#8d3a52;--box-dark:#a8465f;--ribbon:#ff7f97;--flame:#ffc46b;color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.6 var(--body);
  padding-block:2rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100svh;
}
.wrap{max-width:34rem;margin-inline:auto}

/* Pintu masuk: kotak kado */
.gate{
  min-height:78svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.5rem;text-align:center;transition:opacity .5s ease;
}
.gate.leaving{opacity:0}
.giftbtn{all:unset;cursor:pointer;display:block;padding:2.5rem 1.5rem 1rem}
.giftbtn:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:1rem}
.box{position:relative;display:block;width:11rem;height:10rem;animation:wiggle 2.8s ease-in-out infinite}
.base{position:absolute;left:0;right:0;top:3rem;bottom:0;background:var(--box);border-radius:.3rem .3rem .6rem .6rem}
.base::after,.lid::after{
  content:"";position:absolute;left:50%;width:1.7rem;top:0;bottom:0;
  transform:translateX(-50%);background:var(--ribbon);
}
.lid{
  position:absolute;left:-6%;right:-6%;top:0;height:3.5rem;background:var(--box-dark);
  border-radius:.4rem;z-index:2;transform-origin:left bottom;
  transition:transform .7s cubic-bezier(.3,1.4,.5,1);
}
.bow{position:absolute;left:50%;top:-1.5rem;width:0;height:0;z-index:3}
.bow::before,.bow::after{
  content:"";position:absolute;top:0;width:2.6rem;height:2rem;
  border:.45rem solid var(--ribbon);border-radius:50%;
}
.bow::before{right:.1rem;transform:rotate(-25deg)}
.bow::after{left:.1rem;transform:rotate(25deg)}
.gate.open .lid{transform:translate(-1rem,-4.4rem) rotate(-14deg)}
.gate.open .box{animation:none}
@keyframes wiggle{
  0%,45%,85%,100%{transform:rotate(0)}
  55%{transform:rotate(-2.5deg)}
  65%{transform:rotate(2.5deg)}
  75%{transform:rotate(-1.5deg)}
}
.gate-title{font:400 1.9rem/1.2 var(--display);margin:0;text-wrap:balance}
.gate-hint{font:600 1.7rem/1 var(--hand);margin:0;color:var(--muted)}

/* Isi kado */
.gift{display:flex;flex-direction:column;gap:3.5rem;animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font:600 .8rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
h1{font:400 clamp(2.6rem,12vw,4.2rem)/1.05 var(--display);margin:0;color:var(--accent);text-wrap:balance;overflow-wrap:anywhere}
h2{font:400 1.5rem/1.2 var(--display);margin:0 0 1rem;text-wrap:balance}
.counter{margin:1.25rem 0 0;display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;color:var(--muted)}
.counter strong{font:400 2.4rem/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}

.letter-card{
  background:var(--surface);border:1px solid var(--line);border-radius:.5rem;
  padding:1.5rem 1.4rem 1.2rem;
}
.letter-card p{font:500 1.5rem/1.4 var(--hand);margin:0 0 .9rem}
.letter-card .sign{text-align:right;color:var(--accent);margin:0}

.reason{
  min-height:9rem;display:flex;align-items:center;padding:1.4rem;
  background:var(--surface);border:1px solid var(--line);border-radius:.5rem;
}
.reason p{font:400 1.45rem/1.35 var(--display);margin:0;text-wrap:balance}
.reason-ctl{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.reason-ctl span{color:var(--muted);font-variant-numeric:tabular-nums}

.btn{
  font:600 1rem var(--body);padding:.8rem 1.4rem;border-radius:999px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);
}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.polaroid{
  margin:0;width:100%;max-width:26rem;background:var(--paper);padding:.8rem .8rem 1rem;border-radius:.3rem;
  box-shadow:0 6px 18px rgba(59,20,33,.22);transform:rotate(-1.5deg);
}
.polaroid img{display:block;width:100%;height:auto;border-radius:.15rem;background:var(--line)}
.polaroid figcaption{font:600 1.5rem/1.2 var(--hand);color:var(--paper-ink);margin-top:.7rem;text-align:center}
.photos{display:flex;flex-direction:column;gap:2rem}
.polaroid + .polaroid{align-self:flex-end;max-width:20rem;transform:rotate(1.5deg)}
a.btn{text-decoration:none;display:inline-block}
.song{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;padding:1.3rem 1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:.5rem}
.song-info{flex:1;min-width:11rem;display:flex;flex-direction:column;align-items:flex-start;gap:.6rem}
.song-title{font:400 1.6rem/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.song-artist{margin:-.4rem 0 0;color:var(--muted)}
.song-msg{margin:0;font:500 1.4rem/1.3 var(--hand)}
.vinyl{
  position:relative;flex:none;width:9rem;height:9rem;border-radius:50%;
  background:repeating-radial-gradient(circle at center,#17090e 0 2px,#26121b 2px 4px);
  box-shadow:0 0 0 2px var(--line),0 6px 16px rgba(0,0,0,.3);
  animation:spin 7s linear infinite;
}
.vinyl::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 18%,rgba(255,255,255,.16) 25%,transparent 32% 68%,rgba(255,255,255,.16) 75%,transparent 82%);
}
.vinyl-label{position:absolute;inset:33%;border-radius:50%;background:var(--accent)}
.vinyl-label::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.wish{display:flex;align-items:flex-end;gap:1.5rem;flex-wrap:wrap}
.cake{position:relative;width:8rem;height:8rem;flex:none}
.cakebody{position:absolute;left:0;right:0;bottom:0;height:4rem;background:var(--box);border-radius:.4rem}
.cakebody::before{content:"";position:absolute;left:0;right:0;top:0;height:1.2rem;background:var(--surface);border-radius:.4rem .4rem 1rem 1rem}
.candle{position:absolute;left:50%;bottom:4rem;width:.7rem;height:2.2rem;margin-left:-.35rem;background:var(--box-dark);border-radius:.2rem .2rem 0 0}
.flame{
  position:absolute;left:50%;bottom:6.1rem;width:.9rem;height:1.4rem;margin-left:-.45rem;background:var(--flame);
  border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;
  animation:flicker 1.2s ease-in-out infinite;transition:opacity .3s,transform .3s;
}
.cake.out .flame{opacity:0;transform:scale(.2);animation:none}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}}
.answer{font:600 1.9rem/1.25 var(--hand);color:var(--accent);margin:1rem 0 0}
.foot{color:var(--muted);font-size:.9rem;margin:0}

.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.heart{position:absolute;color:var(--accent);line-height:1;animation:rise var(--t,2200ms) ease-out forwards}
@keyframes rise{
  from{transform:translate(0,0) scale(.6);opacity:1}
  to{transform:translate(var(--dx,0),-60vh) scale(1.15);opacity:0}
}

@media (prefers-reduced-motion:reduce){
  .box,.gift,.flame,.vinyl{animation:none}
  .lid,.gate,.flame{transition:none}
}
</style>
<div class="wrap">
  <main class="gate" id="gate">
    <h2 class="gate-title">Ada kado buat kamu</h2>
    <button class="giftbtn" id="giftBtn" aria-label="Buka kado">
      <span class="box">
        <span class="lid"><i class="bow"></i></span>
        <span class="base"></span>
      </span>
    </button>
    <p class="gate-hint">Ketuk kotaknya</p>
  </main>

  <article class="gift" id="gift" hidden>
    <header>
      <p class="eyebrow">Selamat ulang tahun ke-18</p>
      <h1 id="nama"></h1>
    </header>

    <section>
      <h2>Surat kecil</h2>
      <div class="letter-card">
        <div id="letter"></div>
        <p class="sign" id="sign"></p>
      </div>
    </section>

    <section class="photos">
      <figure class="polaroid">
        <img id="foto" alt="Foto kita berdua" width="960" height="720">
        <figcaption id="fotoCap"></figcaption>
      </figure>
      <figure class="polaroid">
        <img id="foto2" alt="Foto Ka Hana" width="720" height="960">
        <figcaption id="fotoCap2"></figcaption>
      </figure>
    </section>

    <section>
      <h2>Hal yang aku suka dari kenal kamu</h2>
      <div class="reason" aria-live="polite"><p id="reasonText"></p></div>
      <div class="reason-ctl">
        <span id="reasonCount"></span>
        <button class="btn ghost" id="nextReason" type="button">Yang lainnya</button>
      </div>
    </section>

    <section>
      <h2>Satu lagu buat kamu</h2>
      <div class="song">
        <div class="vinyl" aria-hidden="true"><span class="vinyl-label"></span></div>
        <div class="song-info">
          <p class="song-title" id="songTitle"></p>
          <p class="song-artist" id="songArtist"></p>
          <p class="song-msg" id="songMsg"></p>
          <a class="btn" id="spLink" target="_blank" rel="noopener">Putar di Spotify</a>
        </div>
      </div>
    </section>

    <section>
      <h2>Satu permintaan terakhir</h2>
      <div class="wish">
        <div class="cake" id="cake" aria-hidden="true">
          <span class="flame"></span>
          <span class="candle"></span>
          <span class="cakebody"></span>
        </div>
        <button class="btn" id="blow" type="button">Tiup lilin</button>
      </div>
      <p class="answer" id="answer" hidden></p>
    </section>

    <p class="foot" id="foot"></p>
  </article>
</div>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
/* ============================================================
   BAGIAN YANG BOLEH LU EDIT: ganti teks di bawah ini supaya
   makin personal. Jangan hapus tanda kutip (") dan koma (,)
   di ujung tiap baris. Semua ini contoh, ganti sesuka lu.
   ============================================================ */
const GIFT = {
  nama: "Ka Hana",                 // nama panggilan dia
  dari: "Aku",                  // nama lu, buat tanda tangan surat
  surat: [
    "Hai, Ka Hana. Selamat ulang tahun yang ke-18!",
    "Semoga apapun yang kamu inginkan segera tercapai, dan semua yang kamu usahakan mendapat hasil yang baik yaww.",
    "Dasar kadek, sekarang jadi orang tuwa. Umurnya udah 18, aku aja masih 15 hehe.",
    "OHIYAA, dan semogaa tb kamu yang nanggung setengah itu nambah yh HAHAHA",
    "Udahh siehh ituu ajaa. Babayyy!"
  ],
  alasan: [
    "Ngobrol sama kamu nggak pernah ngebosenin.",
    "Kamu gampang ketawa, dan itu nular.",
    "Kamu peduli sama hal-hal kecil.",
    "Kamu orangnya apa adanya.",
    "Hari-hari jadi lebih seru sejak kenal kamu."
  ],
  fotoCaption: "Salah satu foto favoritku.",   // tulisan di bawah foto pertama
  foto2Caption: "Foto kamu yang paling lucukkk",   // tulisan di bawah foto kedua
  lagu: {
    judul: "Ah",
    artis: "Nadin Amizah",
    pesan: "Putar lagunya sambil baca, ya.",
    link: "https://open.spotify.com/track/0huV20ZR9HzTmBtXeYpEwD"   // link lagu di Spotify
  },
  doa: "Semoga semua permintaanmu tahun ini kejadian. Selamat ulang tahun, Ka Hana!"
};
/* ============== SELESAI. Di bawah ini jangan diubah ============== */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function burst(n, x, y){
  if (reduce) return;
  const layer = $('hearts');
  for (let i = 0; i < n; i++){
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '✦';
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.setProperty('--dx', ((Math.random() - .5) * 280) + 'px');
    h.style.setProperty('--t', (1600 + Math.random() * 1600) + 'ms');
    h.addEventListener('animationend', () => h.remove());
    layer.appendChild(h);
  }
}

/* Isi halaman dari GIFT */
$('nama').textContent = GIFT.nama;
$('fotoCap').textContent = GIFT.fotoCaption;
$('fotoCap2').textContent = GIFT.foto2Caption;
$('songTitle').textContent = GIFT.lagu.judul;
$('songArtist').textContent = GIFT.lagu.artis;
$('songMsg').textContent = GIFT.lagu.pesan;
$('spLink').href = GIFT.lagu.link;
$('sign').textContent = '— ' + GIFT.dari;
$('foot').textContent = 'Dibuat khusus buat ' + GIFT.nama + '.';
GIFT.surat.forEach(t => {
  const p = document.createElement('p');
  p.textContent = t;
  $('letter').appendChild(p);
});

let ri = 0;
function showReason(){
  $('reasonText').textContent = GIFT.alasan[ri];
  $('reasonCount').textContent = (ri + 1) + ' dari ' + GIFT.alasan.length;
}
$('nextReason').addEventListener('click', () => { ri = (ri + 1) % GIFT.alasan.length; showReason(); });
showReason();

/* Buka kado */
$('giftBtn').addEventListener('click', () => {
  const gate = $('gate');
  if (gate.classList.contains('open')) return;
  gate.classList.add('open');
  const r = $('giftBtn').getBoundingClientRect();
  burst(14, r.left + r.width / 2, r.top + r.height / 2);
  setTimeout(() => gate.classList.add('leaving'), reduce ? 0 : 900);
  setTimeout(() => {
    gate.hidden = true;
    $('gift').hidden = false;
    window.scrollTo(0, 0);
  }, reduce ? 50 : 1400);
});

/* Tiup lilin */
$('blow').addEventListener('click', () => {
  const r = $('cake').getBoundingClientRect();
  $('cake').classList.add('out');
  $('blow').hidden = true;
  $('answer').textContent = GIFT.doa;
  $('answer').hidden = false;
  burst(36, r.left + r.width / 2, r.top + r.height / 4);
});
</script>
